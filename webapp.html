<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Baya Books Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 pb-20">

    <div class="sticky top-0 bg-white shadow-sm p-4 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">Baya Books</h1>
        <div id="user-name" class="text-sm font-semibold text-gray-500">Welcome!</div>
    </div>

    <div class="p-4" id="home-tab">
        <h2 class="text-2xl font-bold mb-4">Discover Protocols</h2>
        
        <div class="grid grid-cols-2 gap-4">
            <!-- Book Card -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden" onclick="requestBook('Atomic Habits', 'James Clear')">
                <img src="https://images.unsplash.com/photo-1589998059171-988d887df646?auto=format&fit=crop&q=80&w=200" alt="Book" class="w-full h-32 object-cover">
                <div class="p-3">
                    <h3 class="font-bold text-sm truncate">Atomic Habits</h3>
                    <p class="text-xs text-gray-500 truncate">James Clear</p>
                </div>
            </div>
            <!-- Book Card -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden" onclick="requestBook('Deep Work', 'Cal Newport')">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=200" alt="Book" class="w-full h-32 object-cover">
                <div class="p-3">
                    <h3 class="font-bold text-sm truncate">Deep Work</h3>
                    <p class="text-xs text-gray-500 truncate">Cal Newport</p>
                </div>
            </div>
             <!-- Book Card -->
             <div class="bg-white rounded-xl shadow-sm overflow-hidden" onclick="requestBook('The Subtle Art', 'Mark Manson')">
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&q=80&w=200" alt="Book" class="w-full h-32 object-cover">
                <div class="p-3">
                    <h3 class="font-bold text-sm truncate">Subtle Art</h3>
                    <p class="text-xs text-gray-500 truncate">Mark Manson</p>
                </div>
            </div>
            <!-- Book Card -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden" onclick="requestBook('Think and Grow Rich', 'Napoleon Hill')">
                <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&q=80&w=200" alt="Book" class="w-full h-32 object-cover">
                <div class="p-3">
                    <h3 class="font-bold text-sm truncate">Think & Grow Rich</h3>
                    <p class="text-xs text-gray-500 truncate">Napoleon Hill</p>
                </div>
            </div>
        </div>

        <div class="mt-8 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-6 text-white text-center shadow-lg">
            <h2 class="text-xl font-bold mb-2">👑 Baya VIP Pass</h2>
            <p class="text-sm mb-4">Get unlimited protocols and skip the payment queue for a whole month.</p>
            <button onclick="buyVIP()" class="bg-white text-blue-600 font-bold py-2 px-6 rounded-full w-full shadow hover:bg-gray-100">Subscribe for 500 ETB</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Display user name
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        function requestBook(title, author) {
            tg.showConfirm(`Do you want to generate a protocol for "${title}" by ${author}?`, function(confirmed) {
                if (confirmed) {
                    const data = { action: 'request_book', title: title, author: author };
                    tg.sendData(JSON.stringify(data));
                }
            });
        }

        function buyVIP() {
            tg.showConfirm(`Upgrade to VIP for 500 ETB? You will get unlimited protocols for 30 days!`, function(confirmed) {
                if (confirmed) {
                    const data = { action: 'buy_vip' };
                    tg.sendData(JSON.stringify(data));
                }
            });
        }
    </script>
</body>
</html>
